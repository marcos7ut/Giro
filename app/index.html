<style>
html,body{margin:0;height:100%;background:#07080A;overflow:hidden}
/* a moldura e a barra "Built with Streamlit" ficam fora da tela (a página do app já tem folga embaixo) */
iframe{position:fixed;top:-3px;left:-3px;width:calc(100% + 6px);height:calc(100% + 52px);border:0;background:#07080A}
#c{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#07080A;color:#A1A1AA;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .5s}
#c.x{opacity:0;pointer-events:none}
#c img{width:84px;height:84px;border-radius:22px;animation:p 1.6s ease-in-out infinite}
#c b{color:#F4F2EE;font-size:22px;letter-spacing:-.02em}#c b i{color:#34D399;font-style:normal}
@keyframes p{50%{transform:scale(.92);opacity:.75}}
</style>
</head>
<body>
<div id="c"><img src="../icon-192.png" alt=""><b>giro<i>.</i></b><span>Abrindo seu painel…</span></div>
<script>
var q=new URLSearchParams(location.search);q.set("embed","true");q.append("embed_options","dark_theme");
var f=document.createElement("iframe");
f.src="https://meugiro.streamlit.app/?"+q.toString();
f.title="Giro";f.allow="clipboard-read; clipboard-write; fullscreen";
f.onload=function(){setTimeout(function(){document.getElementById("c").className="x"},600)};
document.body.appendChild(f);
setTimeout(function(){document.getElementById("c").className="x"},20000);
</script>
